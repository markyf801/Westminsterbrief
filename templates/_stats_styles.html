<style>
.sc-wrap       { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
.sc-h1         { font-size: 24px; font-weight: 700; margin: 0 0 6px; }
.sc-sub        { color: #5a6878; font-size: 14px; margin: 0 0 24px; }

.sc-filters    { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; padding: 16px; background: #f8fafc; border: 1px solid #e5e8ec; border-radius: 6px; }
.sc-filters input,
.sc-filters select { padding: 7px 10px; border: 1px solid #d0d5dd; border-radius: 4px; font-size: 13px; background: #fff; }
.sc-filters input  { flex: 1; min-width: 200px; }
.sc-filters select { min-width: 160px; }
.sc-filters button { padding: 7px 16px; background: #1a4a6e; color: #fff; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.sc-filters button:hover { background: #15395a; }
.sc-filters a.clear-link { font-size: 12px; color: #5a6878; text-decoration: none; align-self: center; white-space: nowrap; }
.sc-filters a.clear-link:hover { color: #1a4a6e; text-decoration: underline; }

.sc-toolbar    { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.sc-count      { font-size: 13px; color: #5a6878; }
.sc-sort       { display: flex; gap: 6px; font-size: 13px; }
.sc-sort span  { color: #9ca3af; }
.sc-sort a     { color: #3b7dd8; text-decoration: none; }
.sc-sort a:hover { text-decoration: underline; }
.sc-sort strong { color: #1a4a6e; font-weight: 600; }

.sc-table      { width: 100%; border-collapse: collapse; font-size: 13px; }
.sc-table th   { text-align: left; padding: 8px 12px; font-size: 12px; font-weight: 600; color: #5a6878; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid #e5e8ec; white-space: nowrap; }
.sc-table td   { padding: 10px 12px; border-bottom: 1px solid #f1f3f5; vertical-align: top; }
.sc-table tr:hover td { background: #f8fafc; }

.sc-pub-name   { font-weight: 600; color: #1a4a6e; text-decoration: none; line-height: 1.4; display: block; }
.sc-pub-name:hover { text-decoration: underline; }
.sc-producer   { font-size: 12px; color: #5a6878; margin-top: 2px; }
.sc-producer-link { font-size: 13px; color: #3b7dd8; text-decoration: none; }
.sc-producer-link:hover { text-decoration: underline; }

.sc-badge      { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.b-annual      { background: #e0e7ff; color: #3730a3; }
.b-quarterly   { background: #dbeafe; color: #1d4ed8; }
.b-monthly     { background: #dcfce7; color: #15803d; }
.b-weekly      { background: #d1fae5; color: #065f46; }
.b-daily       { background: #fef9c3; color: #854d0e; }
.b-biennial    { background: #f3f4f6; color: #374151; }
.b-ad_hoc      { background: #fef3c7; color: #92400e; }
.b-one_off     { background: #f1f5f9; color: #475569; }
.b-unknown     { background: #f9fafb; color: #9ca3af; }

.sc-govuk-link { font-size: 12px; color: #3b7dd8; text-decoration: none; white-space: nowrap; }
.sc-govuk-link:hover { text-decoration: underline; }

.sc-empty      { text-align: center; padding: 60px 0; color: #9ca3af; font-size: 14px; }

.sc-pagination { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 24px; flex-wrap: wrap; font-size: 13px; }
.sc-pagination a,
.sc-pagination span { padding: 5px 11px; border: 1px solid #e5e8ec; border-radius: 4px; text-decoration: none; color: #374151; }
.sc-pagination a:hover { background: #f1f3f5; }
.sc-pagination span.current { background: #1a4a6e; color: #fff; border-color: #1a4a6e; font-weight: 600; }
.sc-pagination span.ellipsis { border: none; color: #9ca3af; }

/* Per-producer page additions */
.sc-context    { color: #374151; font-size: 14px; line-height: 1.6; margin: 0 0 24px; max-width: 760px; }
.sc-crumb      { font-size: 13px; color: #5a6878; margin: 0 0 18px; }
.sc-crumb a    { color: #3b7dd8; text-decoration: none; }
.sc-crumb a:hover { text-decoration: underline; }
.sc-browse     { margin-top: 40px; padding-top: 24px; border-top: 1px solid #e5e8ec; }
.sc-browse h2  { font-size: 15px; font-weight: 700; color: #1a4a6e; margin: 0 0 12px; }
.sc-browse ul  { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.sc-browse a   { font-size: 13px; color: #3b7dd8; text-decoration: none; }
.sc-browse a:hover { text-decoration: underline; }
</style>
