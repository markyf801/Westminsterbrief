<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Access — Westminster Brief</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=optional" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .beta-gate { background: #fff; border: 1px solid #d0d5dd; border-radius: 8px; padding: 40px; max-width: 380px; width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .beta-gate h1 { font-size: 1.2rem; font-weight: 600; margin: 0 0 6px; }
        .beta-gate p { font-size: 0.875rem; color: #555; margin: 0 0 24px; }
        .beta-gate label { font-size: 0.8rem; font-weight: 500; display: block; margin-bottom: 6px; }
        .beta-gate input[type=password] { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 1px solid #d0d5dd; border-radius: 5px; font-size: 0.95rem; margin-bottom: 16px; }
        .beta-gate button { width: 100%; padding: 10px; background: #1a3a5c; color: #fff; border: none; border-radius: 5px; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
        .beta-gate button:hover { background: #234d7a; }
        .beta-gate .error { color: #c0392b; font-size: 0.85rem; margin-bottom: 12px; }
        .beta-tag { display: inline-block; background: #f59e0b; color: #fff; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 3px; letter-spacing: 0.05em; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="beta-gate">
        <span class="beta-tag">BETA</span>
        <h1>Westminster Brief</h1>
        <p>This is a private beta environment. Enter the access password to continue.</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autofocus required>
            <button type="submit">Enter beta</button>
        </form>
    </div>
</body>
</html>
